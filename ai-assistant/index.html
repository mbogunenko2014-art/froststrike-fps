<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEXUS AI</title>
<link rel="preconnect" href="https://text.pollinations.ai">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060c; --panel:rgba(9,14,26,.82); --panel2:rgba(12,18,34,.96);
  --line:rgba(120,190,255,.15); --txt:#e2eaff; --dim:#8fa5c8;
  --acc:#22d3ee; --acc2:#818cf8;
  --bub-you:rgba(34,211,238,.1); --bub-ai:rgba(129,140,248,.09);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Rajdhani',sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
body.light{--bg:#eef3fa;--panel:rgba(255,255,255,.85);--panel2:rgba(255,255,255,.98);
  --line:rgba(30,80,140,.16);--txt:#12213a;--dim:#5b6f8e;--bub-you:rgba(34,150,220,.1);--bub-ai:rgba(99,102,241,.09)}
#aur{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60% 45% at 18% 8%,rgba(34,211,238,.13),transparent 60%),
   radial-gradient(55% 40% at 85% 92%,rgba(129,140,248,.15),transparent 60%)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;z-index:1}
header{display:flex;align-items:center;gap:11px;padding:11px clamp(12px,3vw,24px);
  background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:clamp(15px,2.4vw,19px);letter-spacing:.14em}
.logo b{color:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 2.4s infinite;flex:none}
.dot.err{background:#f87171;animation:none}
body.light .dot{background:#0e9ed8}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}55%{box-shadow:0 0 0 6px rgba(34,211,238,0)}}
.sp{flex:1}
.ib{border:none;background:none;color:var(--dim);font-family:inherit;font-size:17px;
  width:36px;height:36px;border-radius:10px;cursor:pointer;transition:.18s;flex:none}
.ib:hover{color:var(--acc);background:rgba(34,211,238,.08)}
#btnMind{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--txt);
  font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:.04em;
  padding:7px 13px;border-radius:999px;cursor:pointer;transition:.18s;flex:none}
#btnMind:hover{border-color:var(--acc);color:var(--acc)}
#mindPop{position:fixed;top:56px;right:clamp(12px,3vw,24px);z-index:6;width:min(300px,90vw);
  background:var(--panel2);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(20px);
  padding:8px;transform:translateY(-8px);opacity:0;pointer-events:none;transition:.2s ease}
#mindPop.on{transform:none;opacity:1;pointer-events:auto}
.mind{display:flex;flex-direction:column;gap:1px;padding:10px 12px;border-radius:11px;cursor:pointer;transition:.15s}
.mind:hover{background:rgba(34,211,238,.07)}
.mind.on{background:rgba(34,211,238,.1)}
.mind b{font-size:14.5px}
.mind.on b{color:var(--acc)}
.mind span{font-size:12.5px;color:var(--dim)}
#apiKey{margin:6px 4px 4px;width:calc(100% - 8px)!important;border:1px solid var(--line);border-radius:10px;
  background:rgba(255,255,255,.03);color:var(--txt);font-family:inherit;font-size:13.5px;padding:8px 10px;outline:none}
#keyHint{font-size:11.5px;color:var(--dim);padding:0 8px 6px;line-height:1.4}
#keyHint a{color:var(--acc)}
#chat{flex:1;overflow-y:auto;padding:18px clamp(10px,3vw,24px)}
#chat::-webkit-scrollbar{width:8px}
#chat::-webkit-scrollbar-thumb{background:rgba(120,190,255,.16);border-radius:5px}
.msg{display:flex;gap:10px;margin:0 auto 14px;max-width:820px;animation:in .22s ease}
.msg.you{flex-direction:row-reverse}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.av{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-size:11.5px;font-weight:700}
.msg.ai .av{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(129,140,248,.22));color:var(--acc)}
.msg.you .av{background:rgba(127,145,180,.14);color:var(--dim);font-size:10.5px}
.bub{padding:11px 15px;border-radius:14px;font-size:16.5px;line-height:1.58;overflow-wrap:break-word;min-width:0}
.msg.ai .bub{background:var(--bub-ai);border-top-left-radius:4px}
.msg.you .bub{background:var(--bub-you);border-top-right-radius:4px}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul,.bub ol{margin:2px 0 8px 18px}
.bub code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;background:rgba(0,0,0,.3);
  border:1px solid var(--line);border-radius:6px;padding:1px 6px}
body.light .bub code{background:rgba(10,30,60,.07)}
.bub pre{background:rgba(0,0,0,.42);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  overflow-x:auto;margin:8px 0;position:relative}
body.light .bub pre{background:rgba(12,30,60,.07)}
.bub pre code{background:none;border:none;padding:0;line-height:1.5}
.bub a{color:var(--acc)}
.bub h1,.bub h2,.bub h3{font-family:'Orbitron',sans-serif;font-size:14.5px;margin:10px 0 6px}
.copy{position:absolute;top:7px;right:7px;font-size:11px;padding:3px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);cursor:pointer;font-family:inherit}
.copy:hover{color:var(--acc);border-color:var(--acc)}
.acts{display:flex;gap:6px}
.mini{font-size:12px;color:var(--dim);background:none;border:1px solid transparent;border-radius:7px;
  padding:2px 9px;cursor:pointer;font-family:inherit;font-weight:600}
.mini:hover{color:var(--acc);border-color:var(--line)}
.chip{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
  padding:2px 10px;margin-bottom:6px;display:inline-block}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
#hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#heroMark{width:76px;height:76px;border-radius:22px;display:flex;align-items:center;justify-content:center;
  font-family:'Orbitron',sans-serif;font-weight:900;font-size:24px;color:var(--acc);
  background:linear-gradient(135deg,rgba(34,211,238,.16),rgba(129,140,248,.16));
  border:1px solid var(--line);animation:float 3.4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#hero h1{font-family:'Orbitron',sans-serif;font-size:clamp(19px,4vw,27px);letter-spacing:.1em;text-align:center}
#hero p{color:var(--dim);font-size:15.5px;text-align:center}
#heroChips{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:620px}
.qk{font-size:13.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
  padding:6px 15px;cursor:pointer;background:rgba(255,255,255,.02);font-family:inherit;font-weight:600;transition:.16s}
.qk:hover{color:var(--acc);border-color:var(--acc);transform:translateY(-1px)}
#compWrap{padding:10px clamp(10px,3vw,24px) calc(12px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);backdrop-filter:blur(14px)}
#comp{display:flex;gap:10px;align-items:flex-end;max-width:820px;margin:0 auto}
#ta{flex:1;resize:none;max-height:150px;min-height:46px;border-radius:14px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);color:var(--txt);font-family:inherit;font-size:16.5px;
  padding:12px 15px;outline:none;line-height:1.45;transition:border .2s}
#ta:focus{border-color:var(--acc)}
#send{width:46px;height:46px;border-radius:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#04121a;font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:.18s;flex:none}
#send:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(34,211,238,.3)}
#send.stop{background:linear-gradient(135deg,#f87171,#c2410c);color:#fff}
#btnImg{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
  background:rgba(255,255,255,.03);color:var(--dim);font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:.18s;flex:none}
#btnImg:hover,#btnImg.has{border-color:var(--acc);color:var(--acc)}
#imgPrev{display:none;align-items:center;gap:10px;max-width:820px;margin:0 auto 8px;
  padding:8px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.03)}
#imgPrev.on{display:flex}
#imgPrev img{width:58px;height:58px;object-fit:cover;border-radius:10px;flex:none}
#imgPrev span{font-size:12.5px;color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#imgPrev button{cursor:pointer}
.chatimg{max-width:min(240px,60vw);max-height:240px;border-radius:12px;margin-top:8px;display:block;border:1px solid var(--line);cursor:zoom-in}
@media(max-width:640px){
  .bub{font-size:15.5px;padding:10px 13px}
  #chat{padding:12px 9px}
  .msg{gap:8px;margin-bottom:12px}
  .av{width:28px;height:28px;border-radius:8px;font-size:10px}
}
</style>
</head>
<body>
<div id="aur"></div>
<div id="app">
  <header>
    <div class="dot" id="netDot"></div>
    <div class="logo">NEXUS<b>AI</b></div>
    <div class="sp"></div>
    <button id="btnMind" title="Выбрать разум">🧠 Smart ▾</button>
    <button class="ib" id="btnTheme" title="Тема">◐</button>
    <button class="ib" id="btnExport" title="Сохранить диалог">⭳</button>
    <button class="ib" id="btnNew" title="Новый чат">＋</button>
  </header>
  <div id="chat"></div>
  <div id="compWrap">
    <div id="imgPrev"><img id="imgPrevIm" alt="предпросмотр"><span id="imgPrevName"></span>
      <button class="ib" id="imgDel" title="Убрать фото">✕</button></div>
    <div id="comp">
      <input type="file" id="fileIn" accept="image/*" hidden>
      <button id="btnImg" title="Прикрепить фото">📎</button>
      <textarea id="ta" rows="1" placeholder="Спросите что угодно…"></textarea>
      <button id="send" title="Отправить">➤</button>
    </div>
  </div>
</div>

<div id="mindPop">
  <div class="mind" data-m="flash"><b>⚡ Flash</b><span>максимальная скорость</span></div>
  <div class="mind" data-m="smart"><b>🧠 Smart</b><span>баланс ума и скорости</span></div>
  <div class="mind" data-m="deep"><b>🔬 Deep</b><span>думает глубже, чуть дольше</span></div>
  <div class="mind" data-m="ultra"><b>👑 Ultra</b><span>топ-модели — нужен бесплатный ключ</span></div>
  <input id="apiKey" type="password" placeholder="Ключ Pollinations (для Ultra)">
  <div id="keyHint">Бесплатный ключ за минуту: <a href="https://enter.pollinations.ai" target="_blank" rel="noopener">enter.pollinations.ai</a>. Хранится только в этом браузере.</div>
</div>

<script type="module">
/* ================= NEXUS AI ================= */
const $=id=>document.getElementById(id);
const API='https://text.pollinations.ai/openai';
const API_GET='https://text.pollinations.ai';
const GEN='https://gen.pollinations.ai/v1/chat/completions';
const REQ_TIMEOUT=35000;
const SYS='Ты — NEXUS AI, дружелюбный и высокоточный ассистент. Ты НЕ GPT, не ChatGPT, не Claude, не Gemini и не любая другая внешняя модель — эти движки лишь работают под капотом; твоё единственное имя: NEXUS AI. Никогда не называй другие имена моделей от первого лица; на вопрос «кто ты» отвечай «Я NEXUS AI». Отвечай на языке пользователя, конкретно и структурированно: короткие абзацы, списки, код в блоках ``` с указанием языка. Без дисклеймеров и лишних извинений.';
const MINDS={
  flash:{label:'⚡ Flash',models:['openai-fast']},
  smart:{label:'🧠 Smart',models:['openai','openai-fast','gpt-oss-20b']},
  deep:{label:'🔬 Deep',models:['gpt-oss-20b','openai']},
  ultra:{label:'👑 Ultra',models:['openai/gpt-6.1-sol','openai/gpt-5-nano','openai/gpt-oss-120b']}
};
let MODEL_QUEUE=[];

/* ---------- state ---------- */
let MSGS=[],busy=false,ctrl=null,userStop=false,stopReason='';
const SETS=Object.assign({mind:'smart',light:false,key:''},
  JSON.parse(localStorage.getItem('nexus_set2')||'{}'));
const saveSet=()=>localStorage.setItem('nexus_set2',JSON.stringify(SETS));
try{MSGS=JSON.parse(localStorage.getItem('nexus_chat')||'[]')}catch(e){MSGS=[]}
const saveChat=()=>{try{localStorage.setItem('nexus_chat',JSON.stringify(MSGS.slice(-90).map(m=>{if(!m.full)return m;const c=Object.assign({},m);delete c.full;return c})))}catch(e){}};

/* ---------- markdown-lite ---------- */
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(src){
  let out='';
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    blocks.push({lang:lang||'text',code});return '\n\u0001'+(blocks.length-1)+'\u0001\n';
  });
  const lines=src.split('\n');
  let list=null,para=[];
  const flushP=()=>{if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[]}};
  const flushL=()=>{if(list){out+=list==='ul'?'</ul>':'</ol>';list=null}};
  for(let raw of lines){
    const ln=raw.trim();
    const m=ln.match(/^\u0001(\d+)\u0001$/);
    if(m){flushP();flushL();
      const b=blocks[+m[1]];
      out+='<pre><button class="copy">копировать</button><code>'+esc(b.code)+'</code></pre>';continue;}
    const h=ln.match(/^(#{1,3})\s+(.*)/);
    if(h){flushP();flushL();out+='<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>';continue}
    const li=ln.match(/^\s*([-*•]|\d+[.)])\s+(.*)/);
    if(li){flushP();
      const isUl=/^[-*•]/.test(li[1]);
      if(list!==(isUl?'ul':'ol')){flushL();out+=isUl?'<ul>':'<ol>';list=isUl?'ul':'ol'}
      out+='<li>'+inline(li[2])+'</li>';continue;}
    if(ln===''){flushP();flushL();continue}
    para.push(inline(ln));
  }
  if(para.length)out+='<p>'+para.join('<br>')+'</p>';flushL();
  return out;
  function inline(t){
    return esc(t)
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g,'$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  }
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.copy');
  if(c&&navigator.clipboard){navigator.clipboard.writeText(c.nextElementSibling.textContent);
    c.textContent='✓';setTimeout(()=>c.textContent='копировать',1200);}
});

/* identity sanitizer: no other model names from the assistant's own mouth */
function brandFix(t){
  return String(t||'')
    .replace(/(Я|я)(?:\s+—|\s+это|\s+по сути|\s+ просто)?\s+(?:ChatGPT|GPT-[\w.\-]+|Claude\s*[\w.\-]*|Gemini\s*[\w.\-]*|моделью\s+(?:ChatGPT|GPT-[\w.\-]+|Claude\s*[\w.\-]*|Gemini\s*[\w.\-]*))/g,'$1 NEXUS AI')
    .replace(/(меня зовут|меня создал|меня сделали|я разработан[аы]?)\s+(?:компани[ией]+\s+)?(?:OpenAI|Anthropic|Google|Z\.?AI)/gi,'$1 на движке NEXUS')
    .replace(/(NEXUS AI)\s+от\s+(?:компани[ия]+\s+)?(?:OpenAI|Anthropic|Google|Z\.?AI)/gi,'$1')
    .replace(/\s+которы[йо]\s+разработан[аы]?\s+(?:компание[йи]\s+)?(?:OpenAI|Anthropic|Google|Z\.?AI)/gi,'')
    .replace(/разработан[аы]?\s+(?:компанией\s+)?OpenAI/gi,'разработан командой NEXUS')
    .replace(/создан[аы]?\s+(?:компанией\s+)?OpenAI/gi,'создан командой NEXUS');
}

/* ---------- offline engine ---------- */
const KB=[
 [/кто ты|ты кто|что ты за|расскажи о себе/,'Я **NEXUS AI** — ассистент: в интернете мозгом служит большая нейросеть (Pollinations), а без сети — мой встроенный локальный движок.'],
 [/что ты умеешь|что можешь|помощь|help/,'Онлайн — отвечу на любой вопрос. Оффлайн: посчитаю «12*7+3», дату и время, «монетка», «кубик d20», запомню: «запомни …» / «что ты помнишь».'],
 [/погод|дождь|температура за окном/,'Погоду подскажу в онлайн-режиме — подключи интернет и переспроси.'],
 [/как дела|как ты/,'Работаю штатно 🙂 Как сам?'],
 [/привет|здравствуй|хай|hi|hello/,'Привет! Чем заняться?'],
 [/спасибо|благодар/,'Рад помочь!'],
 [/пока|до свидания/,'До встречи!']
];
const MEM_KEY='nexus_mem';
function getMem(){try{return JSON.parse(localStorage.getItem(MEM_KEY)||'[]')}catch(e){return[]}}
function localAnswer(qRaw){
  const q=qRaw.trim(),lq=q.toLowerCase();
  if(/^что ты помнишь|тв\.? заметк|покажи заметк/.test(lq)){
    const mem=getMem();
    return mem.length?'**Мои заметки:**\n'+mem.map((m,i)=>(i+1)+'. '+m).join('\n')
      :'Пока заметок нет. Скажи «запомни …».';
  }
  const memo=lq.match(/^запомни[:\s]+(.+)/);
  if(memo){
    const mem=getMem();const note=qRaw.trim().replace(/^запомни[:\s]*/i,'');
    mem.push(note);localStorage.setItem(MEM_KEY,JSON.stringify(mem.slice(-30)));
    return 'Запомнил: «'+note+'». «Что ты помнишь» — покажет список.';
  }
  const dice=lq.match(/кубик\s*d?(\d+)?/);
  if(dice)return '🎲 Выпало: **'+(1+Math.floor(Math.random()*+(('0'+dice[1])||6)))+'** (d'+(dice[1]||6)+')';
  if(/монет[ак]|решк|орел|орёл/.test(lq))return '🪙 **'+(Math.random()<.5?'орёл':'решка')+'**';
  if(/который час|сколько времени/.test(lq))return '⏰ **'+new Date().toLocaleTimeString('ru-RU')+'**';
  if(/какое (сегодня )?(число|дата)|какой (день|сег|мес)|какая дата/.test(lq))
    return '📅 '+new Date().toLocaleDateString('ru-RU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const expr=q.replace(/[^0-9+\-*/().,%^\s]/g,' ').replace(/\s+/g,' ').trim();
  if(/^[\d\s+\-*/().,%^]+$/.test(expr)&&/\d[\s]*[+\-*/^%]/.test(expr)&&expr.replace(/\D/g,'').length>1){
    try{
      const val=Function('"use strict";return ('+expr.replace(/\^/g,'**').replace(/,(\d)/g,'.$1')+')')();
      if(typeof val==='number'&&isFinite(val))
        return '**'+q.replace(/[?=]/g,'').trim()+' = '+Math.round(val*1e8)/1e8+'**';
    }catch(e){}
  }
  for(const[re,ans]of KB)if(re.test(lq))return ans;
  return null;
}

/* ---------- network ---------- */
function stripTags(t){return String(t||'').replace(/<\/?think>/g,'')}
function cleanOut(t){return stripTags(t).replace(/^[\s\uFEFF]+|[\s]+$/g,'')}
function buildCtx(){
  const tail=MSGS.slice(-14);
  return [{role:'system',content:SYS},
    ...tail.map((m,i)=>{
      const last=i===tail.length-1;
      if(m.img&&last&&m.full)
        return {role:m.role,content:[{type:'text',text:m.text},
          {type:'image_url',image_url:{url:m.full}}]};
      if(m.img)return {role:m.role,content:m.text+' [к сообщению приложено фото]'};
      return {role:m.role,content:m.text};
    })];
}
function headers(){
  const h={'Content-Type':'application/json'};
  if(SETS.key)h['Authorization']='Bearer '+SETS.key;
  return h;
}
function reqTimeout(){return setTimeout(()=>{if(stopReason==='')stopReason='timeout';ctrl.abort();},REQ_TIMEOUT);}
async function tryStream(model,here){
  ctrl=new AbortController();stopReason='';
  const t=reqTimeout();
  let r;
  try{
    r=await fetch(SETS.mind==='ultra'?GEN:API,{method:'POST',headers:headers(),
      body:JSON.stringify({model,messages:buildCtx(),stream:true,temperature:.65}),signal:ctrl.signal});
  }catch(e){clearTimeout(t);throw e}
  clearTimeout(t);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const ct=r.headers.get('content-type')||'';
  if(!r.body||/application\/json/.test(ct)){
    return await finishNonStream(here,await r.json());
  }
  const rd=r.body.getReader(),dec=new TextDecoder();
  let buf='';
  for(;;){
    const {done,value}=await rd.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    const parts=buf.split('\n');buf=parts.pop();
    for(let line of parts){
      line=line.replace(/\r$/,'');
      if(!line||line.startsWith(':'))continue;
      let data=line;
      if(data.startsWith('data:')){data=data.slice(5);if(data.startsWith(' '))data=data.slice(1);}
      if(data.trim()==='[DONE]')return;
      try{
        const j=JSON.parse(data);
        if(j.error)throw new Error(j.error.message||'api error');
        const ch=j.choices&&j.choices[0];
        const d=(ch&&(ch.delta||ch.message))||{};
        const piece=typeof d.content==='string'?d.content:'';
        if(piece)here(stripTags(piece));
      }catch(e){}
    }
  }
}
async function tryJson(model,here){
  ctrl=new AbortController();stopReason='';
  const t=reqTimeout();
  let r;
  try{
    r=await fetch(SETS.mind==='ultra'?GEN:API,{method:'POST',headers:headers(),
      body:JSON.stringify({model,messages:buildCtx(),stream:false,temperature:.65}),signal:ctrl.signal});
  }catch(e){clearTimeout(t);throw e}
  clearTimeout(t);
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await finishNonStream(here,await r.json());
}
async function finishNonStream(here,j){
  const ch=j&&j.choices&&j.choices[0];
  const txt=cleanOut(ch&&(ch.message&&ch.message.content||ch.text)||(j&&j.content)||'');
  if(!txt)throw new Error('пустой ответ');
  here(txt);
}
async function tryGet(){
  const q=MSGS.filter(m=>m.role==='user').pop();
  const url=API_GET+'/'+encodeURIComponent((q?q.text:'hi').slice(-700))
    +'?model='+(MODEL_QUEUE[0]||'openai-fast')+'&system='+encodeURIComponent(SYS)+'&temperature=0.65';
  ctrl=new AbortController();stopReason='';
  const t=reqTimeout();
  let r;
  try{r=await fetch(url,{signal:ctrl.signal});}finally{clearTimeout(t);}
  if(!r.ok)throw new Error('HTTP '+r.status);
  const raw=await r.text();
  let out=raw;
  try{const j=JSON.parse(raw);
    out=(typeof j==='string')?j:
      (j.choices&&j.choices[0]&&(j.choices[0].message&&j.choices[0].message.content||j.choices[0].text))||
      j.content||raw;}catch(e){}
  out=cleanOut(out);
  if(!out)throw new Error('пустой ответ');
  return out;
}

/* ---------- respond cascade ---------- */
async function respond(){
  busy=true;userStop=false;
  const btn=$('send');btn.classList.add('stop');btn.textContent='■';
  const chat=$('chat');
  const{bub,el}=addMsgEl('assistant');
  bub.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  chat.appendChild(el);
  const nearBottom=chat.scrollHeight-chat.scrollTop-chat.clientHeight<160;
  const stick=()=>{if(nearBottom)chat.scrollTop=chat.scrollHeight};
  let acc='';
  const here=t=>{if(!acc)bub.innerHTML='';acc+=t;bub.innerHTML=md(brandFix(acc));stick();};
  const attempts=[];
  for(const mdl of MODEL_QUEUE){
    attempts.push(()=>tryStream(mdl,here));
    attempts.push(()=>tryJson(mdl,here));
  }
  const hasImg=(()=>{for(let i=MSGS.length-1;i>=0;i--){if(MSGS[i].role==='user')return !!MSGS[i].img}return false})();
  if(SETS.mind!=='ultra'&&!hasImg)attempts.push(async()=>{here(await tryGet())});
  let ok=false,lastErr=null;
  for(const at of attempts){
    if(userStop)break;
    try{await at();ok=true;break;}
    catch(err){
      if(userStop){break;}
      if(stopReason==='timeout'){stopReason='';continue;}
      lastErr=err;
      bub.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
    }
  }
  let finalText='',offline=false;
  if(acc){finalText=brandFix(acc).replace(/\s+$/,'');}
  else if(userStop){finalText='⏹ Остановлено.';}
  else{
    const loc=localAnswer(MSGS[MSGS.length-1]&&MSGS[MSGS.length-1].text||'');
    offline=true;
    finalText=loc||('Не удалось получить ответ: '+((lastErr&&lastErr.message)||'сеть недоступна')+
      '. Проверь подключение и попробуй ещё раз.');
    $('netDot').classList.add('err');
  }
  if(ok)$('netDot').classList.remove('err');
  if(offline){
    const chip=document.createElement('div');chip.className='chip';chip.textContent='офлайн-режим';
    el.insertBefore(chip,el.firstChild);
  }
  bub.innerHTML=md(finalText);
  MSGS.push({role:'assistant',text:finalText});saveChat();
  const acts=document.createElement('div');acts.className='acts';
  const rg=document.createElement('button');rg.className='mini';rg.textContent='↻ ещё раз';
  rg.onclick=()=>{if(busy)return;
    let i=MSGS.length-1;while(i>=0&&MSGS[i].role!=='user')i--;
    if(i>=0){MSGS.splice(i+1);saveChat();render();respond();}};
  acts.appendChild(rg);
  el.querySelector('.body').appendChild(acts);
  stick();
  busy=false;ctrl=null;
  btn.classList.remove('stop');btn.textContent='➤';
}

let PEND=null;
function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' МБ':Math.round(n/1024)+' КБ'}
function readImg(file){
  return new Promise((res,rej)=>{
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new window.Image();
      img.onload=()=>{
        const mk=(maxW,q)=>{
          const k=Math.min(1,maxW/Math.max(img.width,img.height));
          const c=document.createElement('canvas');
          c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
          const g=c.getContext&&c.getContext('2d');
          if(g)g.drawImage(img,0,0,c.width,c.height);
          return c.toDataURL('image/jpeg',q);
        };
        res({full:mk(1150,.85),thumb:mk(300,.75),name:file.name,size:file.size});
      };
      img.onerror=()=>rej(new Error('не удалось прочитать изображение'));
      img.src=rd.result;
    };
    rd.onerror=()=>rej(new Error('не удалось прочитать файл'));
    rd.readAsDataURL(file);
  });
}
function showImgPrev(){
  $('btnImg').classList.add('has');$('imgPrev').classList.add('on');
  $('imgPrevIm').src=PEND.thumb;
  $('imgPrevName').textContent=PEND.name+' · '+fmtSize(PEND.size);
}
function clearImg(){
  PEND=null;
  $('btnImg').classList.remove('has');$('imgPrev').classList.remove('on');
  $('imgPrevIm').removeAttribute('src');$('imgPrevName').textContent='';
}

/* ---------- UI ---------- */
function addMsgEl(role){
  const el=document.createElement('div');
  el.className='msg '+(role==='user'?'you':'ai');
  el.innerHTML='<div class="av">'+(role==='user'?'ВЫ':'N∈')+'</div>'+
    '<div class="body"><div class="bub"></div></div>';
  return{el,bub:el.querySelector('.bub')};
}
function addMsg(role,text,raw){
  const {el,bub}=addMsgEl(role);
  if(raw)bub.textContent=text;else bub.innerHTML=md(text);
  $('chat').appendChild(el);
  $('chat').scrollTop=$('chat').scrollHeight;
}
function render(){
  const chat=$('chat');chat.innerHTML='';
  if(!MSGS.length){
    chat.innerHTML='<div id="hero"><div id="heroMark">N∈</div><h1>ЧЕМ ПОМОЧЬ?</h1>'+
      '<p>Спрашивай о чём угодно — работаю и онлайн, и без сети.</p><div id="heroChips"></div></div>';
    const hc=$('heroChips');
    for(const q of ['Объясни нейросети просто','Напиши игру на Python','Придумай сюжет сериала','Как перестать прокрастинировать?']){
      const b=document.createElement('button');b.className='qk';b.textContent=q;
      b.onclick=()=>{$('ta').value=q;send();};
      hc.appendChild(b);
    }
    return;
  }
  for(const m of MSGS){
    if(m.role==='user'&&m.thumb){addUserMsg(m);continue;}
    addMsg(m.role,m.text);
  }
}
function addUserMsg(m){
  const {el,bub}=addMsgEl('user');
  bub.innerHTML=md(m.text);
  if(m.thumb){const im=document.createElement('img');im.className='chatimg';im.src=m.thumb;bub.appendChild(im);}
  $('chat').appendChild(el);
  $('chat').scrollTop=$('chat').scrollHeight;
}
async function send(){
  if(busy)return;
  const ta=$('ta'),text=ta.value.trim();
  if(!text&&!PEND)return;
  const msg={role:'user',text:text||('Опиши, что на фото'+(PEND?' «'+PEND.name+'»':''))};
  if(PEND){msg.img=true;msg.thumb=PEND.thumb;msg.full=PEND.full;msg.name=PEND.name}
  ta.value='';ta.style.height='auto';
  MSGS.push(msg);saveChat();
  const hero=$('hero');if(hero)hero.remove();
  addUserMsg(msg);
  clearImg();
  respond();
}
function stopGen(){userStop=true;stopReason='';if(ctrl)ctrl.abort();}
function netDot(){
  const upd=()=>$('netDot').classList.toggle('err',navigator.onLine===false);
  upd();window.addEventListener('online',upd);window.addEventListener('offline',upd);
}

/* ---------- wiring ---------- */
function syncMindLbl(){
  $('btnMind').textContent=(MINDS[SETS.mind]||MINDS.smart).label+' ▾';
  document.querySelectorAll('.mind').forEach(n=>n.classList.toggle('on',n.dataset.m===SETS.mind));
}
function rebuildQueue(){
  MODEL_QUEUE=MINDS[SETS.mind].models.filter(m=>SETS.mind!=='ultra'||SETS.key);
  if(!MODEL_QUEUE.length)MODEL_QUEUE=MINDS.smart.models;
}
async function init(){
  render();netDot();syncMindLbl();rebuildQueue();
  $('apiKey').value=SETS.key;
  const ta=$('ta');
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,150)+'px'});
  ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  $('send').onclick=()=>{busy?stopGen():send();};
  $('btnImg').onclick=()=>{$('fileIn').click();};
  $('imgDel').onclick=clearImg;
  $('fileIn').onchange=e=>{
    const f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(!f||!/^image\//.test(f.type))return;
    readImg(f).then(d=>{PEND=d;showImgPrev();}).catch(()=>{});
  };
  $('btnMind').onclick=e=>{e.stopPropagation();$('mindPop').classList.toggle('on');};
  document.addEventListener('click',e=>{
    if(!e.target.closest('#mindPop')&&!e.target.closest('#btnMind'))$('mindPop').classList.remove('on');
  });
  document.querySelectorAll('.mind').forEach(n=>n.onclick=()=>{
    SETS.mind=n.dataset.m;saveSet();syncMindLbl();rebuildQueue();
    $('mindPop').classList.remove('on');
  });
  $('apiKey').oninput=e=>{
    SETS.key=e.target.value.trim();saveSet();rebuildQueue();
    if(SETS.mind==='ultra')syncMindLbl();
  };
  $('btnTheme').onclick=()=>{SETS.light=!SETS.light;document.body.classList.toggle('light',SETS.light);saveSet();};
  $('btnNew').onclick=()=>{if(busy)stopGen();MSGS=[];saveChat();render();};
  $('btnExport').onclick=()=>{
    const txt=MSGS.map(m=>(m.role==='user'?'ВЫ':'NEXUS')+':\n'+m.text).join('\n\n———\n\n');
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([txt||'Пустой диалог'],{type:'text/plain;charset=utf-8'}));
    a.download='nexus-ai.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
}
init();
</script>
